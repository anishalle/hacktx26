AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: HackTX newcomer assistant - minimal AWS backend

Parameters:
  ProjectName:
    Type: String
    Default: hacktx-newcomer
    AllowedPattern: '[a-z][a-z0-9-]{2,30}'
  DatabaseVersion:
    Type: String
    Default: '17.9'
  GenerationModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0

Resources:
  DatabaseVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.76.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-database'
  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DatabaseVpc
      CidrBlock: 10.76.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DatabaseVpc
      CidrBlock: 10.76.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound connections; database accessed using IAM-authorized Data API
      VpcId: !Ref DatabaseVpc
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
          Description: No external egress
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private Aurora subnets
      SubnetIds: [!Ref DatabaseSubnetA, !Ref DatabaseSubnetB]
  DatabaseCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: aurora-postgresql
      EngineVersion: !Ref DatabaseVersion
      DatabaseName: newcomer
      MasterUsername: newcomer_admin
      ManageMasterUserPassword: true
      StorageEncrypted: true
      EnableHttpEndpoint: true
      BackupRetentionPeriod: 1
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds: [!Ref DatabaseSecurityGroup]
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 2
      Tags:
        - Key: Project
          Value: !Ref ProjectName
  DatabaseWriter:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref DatabaseCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true

  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub '${MediaBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  EventsApi:
    Type: AWS::AppSync::Api
    Properties:
      Name: !Sub '${ProjectName}-events'
      EventConfig:
        AuthProviders:
          - AuthType: AWS_IAM
        ConnectionAuthModes:
          - AuthType: AWS_IAM
        DefaultPublishAuthModes:
          - AuthType: AWS_IAM
        DefaultSubscribeAuthModes:
          - AuthType: AWS_IAM
  GroupEvents:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt EventsApi.ApiId
      Name: groups
  PrivateEvents:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt EventsApi.ApiId
      Name: users

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      Auth:
        EnableIamAuthorizer: true
        DefaultAuthorizer: AWS_IAM
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      AccessLogSettings:
        DestinationArn: !GetAtt HttpAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","route":"$context.routeKey","status":"$context.status","latency":"$context.responseLatency","integrationLatency":"$context.integrationLatency"}'
  HttpAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-api'
      RetentionInDays: 7
  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiLogs
    Properties:
      FunctionName: !Sub '${ProjectName}-api'
      CodeUri: .build/lambda/
      Handler: lambda_handler.handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 28
      Environment:
        Variables:
          PROJECT_NAME: HackTX Newcomer Assistant
          FASTAPI_ENV: production
          DATABASE_NAME: newcomer
          DATABASE_CLUSTER_ARN: !GetAtt DatabaseCluster.DBClusterArn
          DATABASE_SECRET_ARN: !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
          MEDIA_BUCKET: !Ref MediaBucket
          APPSYNC_HTTP_ENDPOINT: !Sub 'https://${EventsApi.Dns.Http}/event'
          APPSYNC_REALTIME_ENDPOINT: !Sub 'wss://${EventsApi.Dns.Realtime}/event/realtime'
          GENERATION_MODEL_ID: !Ref GenerationModelId
          EMBEDDING_MODEL_ID: !Ref EmbeddingModelId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BatchExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              Resource: !GetAtt DatabaseCluster.DBClusterArn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
              Resource: !Sub '${MediaBucket.Arn}/*'
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt MediaBucket.Arn
            - Effect: Allow
              Action: appsync:EventPublish
              Resource:
                - !Sub '${EventsApi.ApiArn}/channelNamespace/groups'
                - !Sub '${EventsApi.ApiArn}/channelNamespace/users'
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${GenerationModelId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}'
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/v1/health
            Method: GET
            Auth:
              Authorizer: NONE
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  ApiFunctionName:
    Value: !Ref ApiFunction
  DatabaseClusterArn:
    Value: !GetAtt DatabaseCluster.DBClusterArn
  DatabaseSecretArn:
    Value: !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
  DatabaseName:
    Value: newcomer
  MediaBucketName:
    Value: !Ref MediaBucket
  EventsApiId:
    Value: !GetAtt EventsApi.ApiId
  EventsHttpUrl:
    Value: !Sub 'https://${EventsApi.Dns.Http}/event'
  EventsWebSocketUrl:
    Value: !Sub 'wss://${EventsApi.Dns.Realtime}/event/realtime'
  GenerationModelId:
    Value: !Ref GenerationModelId
  EmbeddingModelId:
    Value: !Ref EmbeddingModelId
