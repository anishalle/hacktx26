[project]
name = "hacktx26"
version = "0.1.0"
description = "FastAPI backend for HackTX 26"
readme = "README.md"
authors = [
    { name = "anishalle", email = "anish.alle11@gmail.com" }
]
requires-python = ">=3.12.11"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.4",
    "openai>=3.37.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sentry-sdk>=2.69.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.27.0",
    "httpx-ws>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6.0",
]

[tool.uv.build-backend]
module-name = "app"
module-root = "backend"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
