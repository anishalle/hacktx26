# Local Postgres + pgvector for tests and offline development. The shared database is Timescale Cloud via DATABASE_URL.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: hacktx
      POSTGRES_PASSWORD: hacktx
      POSTGRES_DB: hacktx
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hacktx"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
