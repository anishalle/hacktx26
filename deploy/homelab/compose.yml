# Dev API at https://hacktx26.anishalle.com (homelab, ~/apps/hacktx26).
# NGINX on the host terminates TLS and proxies to 127.0.0.1:8740.
services:
  api:
    build: .
    container_name: hacktx26-api
    env_file: .env
    environment:
      PUBLIC_URL: https://hacktx26.anishalle.com
      MEDIA_DIR: /code/media
    volumes:
      - ./media:/code/media # photo messages; kept across rebuilds
    ports:
      - "127.0.0.1:8740:8000"
    restart: unless-stopped
